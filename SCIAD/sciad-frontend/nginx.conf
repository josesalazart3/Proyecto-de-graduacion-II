# SCIAD — Configuración de nginx (frontend compilado por Angular)
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip para transferencias más livianas
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- PWA / móviles (Fase 2) ---------------------------------------------------------
    # index.html SIEMPRE se revalida: si un celular conserva un index viejo, apuntaría a chunks
    # con hash que ya no existen tras un despliegue (pantalla en blanco). Los assets con hash
    # sí se cachean 1 año (bloque de estáticos). add_header en un location anula los del
    # server, por eso se repiten las cabeceras de seguridad aquí.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # Manifest de la app instalable: MIME correcto y sin caché larga.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta no coincidente → index.html (deja que Angular enrute)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos estáticos con caché larga (hash en el nombre => inmutables).
    # Si un archivo ya no existe (hash viejo), devuelve 404 — no el index.html.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map|json)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy hacia la API (Fase 3, §4.4): activo — todas las rutas /api/* al backend.
    # backend escucha en :8080 dentro de la red de docker (mapeado a :3000 en el host);
    # el SPA solo conoce rutas relativas (/api/...) y aquí se resuelve la red interna.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Seguridad básica de cabeceras
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
}