# SCIAD — Configuración de nginx (frontend compilado por Angular)
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip para transferencias más livianas
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: cualquier ruta no coincidente → index.html (deja que Angular enrute)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos estáticos con caché larga (hash en el nombre => inmutables).
    # Si un archivo ya no existe (hash viejo), devuelve 404 — no el index.html.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map|json)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy hacia la API. En Fase 1 el frontend usa datos mock (interceptor),
    # así que este bloque queda inactivo. En Fase 2 apuntará al backend real.
    # location /api/ {
    #     proxy_pass http://backend:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # Seguridad básica de cabeceras
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}