# ============================================================
# SCIAD — Configuración de nginx para PRODUCCIÓN
# Terminación TLS (Let's Encrypt) + SPA + proxy /api → backend
# ============================================================

# ---- Puerto 80: challenge ACME (Let's Encrypt) + redirección a HTTPS ----
server {
    listen       80;
    server_name  sciad.gt www.sciad.gt;

    # Challenge HTTP-01 de certbot — SIEMPRE disponible (renovación sin parar el contenedor)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Puerto 443: TLS ----
server {
    listen       443 ssl;
    http2        on;
    server_name  sciad.gt www.sciad.gt;

    # Certificados emitidos por certbot en el HOST y montados como volumen
    # (docker-compose.prod.yml monta /etc/letsencrypt, no se versionan).
    ssl_certificate     /etc/letsencrypt/live/sciad.gt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sciad.gt/privkey.pem;

    # TLS 1.2/1.3 únicamente (RNF-01 / SEC-07). DH params opcionales.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ssl_dhparam /etc/nginx/dhparam.pem;   # descomentar si se generó (openssl dhparam -out /etc/ssl/private/dhparam.pem 2048)

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Estáticos inmutables (hash en nombre)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map|json)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy hacia la API (mismo dominio, sin cambios CORS)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cabeceras de seguridad (SEC-03 / SEC-07)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}