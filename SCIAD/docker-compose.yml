# ============================================================
# SCIAD — docker-compose
#
# Fase 1: solo el frontend (datos mock). Levanta con:
#   docker compose up --build
#   → http://localhost:8080
#
# Fase 2: descomenta los servicios `backend` y `db` de abajo,
# apunta nginx a `http://backend:3000` (ya dejado comentado en
# nginx.conf) y cambia `environment.apiUrl` en el frontend.
# ============================================================
services:
  frontend:
    build:
      context: ./sciad-frontend
      dockerfile: Dockerfile
    container_name: sciad-frontend
    ports:
      - "8080:80"
    restart: unless-stopped

  # ---- FASE 2: Backend (API REST) ----
