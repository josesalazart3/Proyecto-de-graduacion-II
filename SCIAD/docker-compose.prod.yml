# ============================================================
# SCIAD — docker-compose de PRODUCCIÓN
#
# Diferencias frente a docker-compose.yml (desarrollo):
#   • DB SIN puertos expuestos al exterior (solo red interna).
#   • Backend sin puerto en el host (lo expone nginx vía proxy).
#   • TLS terminado en nginx (Let's Encrypt), certificado montado.
#   • Secretos desde .env.prod (NO versionado) vía --env-file.
#   • Red con IPs estáticas para que el rate-limit (SEC-04) se
#     partitione por IP real del cliente: el backend confía en la
#     IP del proxy nginx (ForwardedHeaders__KnownProxies).
#
# Uso:
#   cp .env.example .env.prod          # llenar secretos reales
#   docker compose --env-file .env.prod -f docker-compose.prod.yml build
#   # 1.ª vez: emitir TLS ANTES de arrancar (ver DESPLIEGUE.md §4)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# ============================================================

services:
  frontend:
    build:
      context: ./sciad-frontend
      dockerfile: Dockerfile.prod
    image: sciad-prod/frontend:latest
    container_name: sciad-prod-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Solo el certificado y el webroot de certbot (host) → RO.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      prod-net:
        ipv4_address: 172.20.0.10
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/.well-known/acme-challenge/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./sciad-backend
      dockerfile: Dockerfile
    image: sciad-prod/backend:latest
    container_name: sciad-prod-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL:-200}
      - Jwt__Secreto=${SCIAD_JWT_SECRET}
      # CORS: mismo origen en producción (nginx sirve SPA y /api) — se deja el dominio
      # explícito por compatibilidad si algún día el SPA se sirve desde otro origen.
      - Cors__Origins=${SCIAD_CORS_ORIGINS}
      # SEC-04: tras el proxy nginx, confiar solo en la IP del frontend (IP estática 172.20.0.10)
      - ForwardedHeaders__KnownProxies=172.20.0.10
      - RateLimit__LoginPermitLimit=${RATE_LIMIT_LOGIN_PERMIT:-5}
      - RateLimit__LoginWindowSeconds=${RATE_LIMIT_LOGIN_WINDOW:-300}
    networks:
      prod-net:
        ipv4_address: 172.20.0.20
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: sciad-prod-db
    # SIN puertos publicados: solo accesible desde la red interna.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - prod-db-data:/var/lib/postgresql/data
    networks:
      prod-net:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  prod-db-data:

networks:
  prod-net:
    ipam:
      config:
        - subnet: 172.20.0.0/24